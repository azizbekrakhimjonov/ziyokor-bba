# /etc/nginx/sites-available/ziyokortest.uz
# Certbot ishlaguncha faqat 80-port blokini qoldiring; SSL qatorlar certbot qo'shadi.

upstream bba_node {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ziyokortest.uz www.ziyokortest.uz;

    # Certbot uchun (HTTPS yoqilguncha):
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ziyokortest.uz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ziyokortest.uz;

    # Certbot quyidagilarni to'ldiradi:
    ssl_certificate     /etc/letsencrypt/live/ziyokortest.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ziyokortest.uz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://ziyokortest.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ziyokortest.uz;

    ssl_certificate     /etc/letsencrypt/live/ziyokortest.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ziyokortest.uz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    access_log /var/log/nginx/ziyokortest.uz.access.log;
    error_log  /var/log/nginx/ziyokortest.uz.error.log;

    location / {
        proxy_pass http://bba_node;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
