upstream bba_app {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name ziyokortest.uz www.ziyokortest.uz;
    return 301 https://ziyokortest.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ziyokortest.uz;

    ssl_certificate     /etc/letsencrypt/live/ziyokortest.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ziyokortest.uz/privkey.pem;

    return 301 https://ziyokortest.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ziyokortest.uz;

    ssl_certificate     /etc/letsencrypt/live/ziyokortest.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ziyokortest.uz/privkey.pem;

    client_max_body_size 4m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://bba_app;
    }
}
